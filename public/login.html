<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход - LoveMatch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <nav class="navbar">
      <div class="container">
        <a href="/" class="logo">💕 LoveMatch</a>
      </div>
    </nav>

    <div class="auth-box">
      <h2>Вход в профиль</h2>

      <div id="message" class="message"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Имя пользователя или Email</label>
          <input type="text" id="username" name="username" required autofocus>
        </div>

        <div class="form-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-large">Войти</button>
      </form>

      <div class="auth-link">
        Нет аккаунта? <a href="/register">Создать новый</a>
      </div>

      <div class="demo-info">
        <strong>🔓 Демо вход:</strong><br>
        admin14 / admin123
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const messageEl = document.getElementById('message');

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (data.success) {
          window.location.href = '/discover';
        } else {
          messageEl.textContent = '❌ ' + (data.message || 'Ошибка входа');
          messageEl.className = 'message error';
        }
      } catch (error) {
        messageEl.textContent = '❌ Ошибка подключения';
        messageEl.className = 'message error';
      }
    });
  </script>
</body>
</html>
