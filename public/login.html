<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход - LoveMatch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <nav class="navbar">
      <div class="container">
        <a href="/" class="logo">💕 LoveMatch</a>
      </div>
    </nav>

    <div class="auth-box">
      <h2>Вход в профиль</h2>

      <div id="message" class="message"></div>

      <form method="POST" action="/api/login-submit">
        <div class="form-group">
          <label for="username">Имя пользователя</label>
          <input type="text" id="username" name="username" required autofocus>
        </div>

        <div class="form-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-large">Войти</button>
      </form>

      <div class="auth-link">
        Нет аккаунта? <a href="/register">Создать новый</a>
      </div>

      <div class="demo-info">
        <strong>🔓 Демо вход:</strong><br>
        admin14 / admin123
      </div>
    </div>
  </div>
</body>
</html>
