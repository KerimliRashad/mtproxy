<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль - LoveMatch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="/discover" class="logo">💕 LoveMatch</a>
      <div class="nav-links">
        <span id="username" class="username"></span>
        <a href="/notifications" class="nav-item" style="position: relative;">
          🔔 <span id="notifBadge" style="position: absolute; top: -8px; right: -8px; background: #ff4458; color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; display: none;">0</span>
        </a>
        <a href="/discover" class="nav-item">🔍 Поиск</a>
        <a href="/matches" class="nav-item">💑 Мэтчи</a>
        <a href="/messages" class="nav-item">💬 Сообщения</a>
        <a href="/api/logout" class="nav-item">Выход</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="profile-section">
      <h1>👤 Мой профиль</h1>

      <div class="profile-card">
        <div class="profile-avatar-large">👤</div>

        <div class="profile-form">
          <div class="form-group">
            <label>Фото профиля (главное)</label>
            <input type="file" id="avatarInput" accept="image/*">
            <button type="button" id="uploadBtn" class="btn btn-small" style="margin-top: 10px;">📤 Загрузить фото</button>
          </div>

          <div class="form-group">
            <label>Галерея фото (до 10 фото)</label>
            <input type="file" id="galleryInput" accept="image/*" multiple>
            <button type="button" id="uploadGalleryBtn" class="btn btn-small" style="margin-top: 10px;">📸 Добавить в галерею</button>
            <div id="galleryPreview" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 15px;"></div>
          </div>

          <div class="form-group">
            <label>Имя пользователя</label>
            <input type="text" id="username" disabled class="form-input">
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" disabled class="form-input">
          </div>

          <div class="form-group">
            <label>Возраст</label>
            <input type="text" id="age" disabled class="form-input">
          </div>

          <div class="form-group">
            <label>Город</label>
            <input type="text" id="city" disabled class="form-input">
          </div>

          <div class="form-group">
            <label>Обо мне</label>
            <textarea id="about" class="form-input textarea" rows="4" placeholder="Расскажи о себе..."></textarea>
          </div>

          <div class="form-group">
            <label>Интересы (через запятую)</label>
            <input type="text" id="interests" class="form-input" placeholder="путешествия, кино, спорт">
          </div>

          <div class="form-group">
            <label>Ищу</label>
            <select id="looking_for" class="form-input">
              <option value="отношения">Серьезные отношения</option>
              <option value="дружба">Дружба</option>
              <option value="встречи">Встречи</option>
            </select>
          </div>

          <button id="saveBtn" class="btn btn-large">💾 Сохранить профиль</button>
        </div>
      </div>
    </div>
  </div>

  <style>
    .profile-section {
      margin: 40px 0;
    }

    .profile-section h1 {
      font-size: 32px;
      margin-bottom: 30px;
      color: #333;
    }

    .profile-card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      margin: 0 auto;
    }

    .profile-avatar-large {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      margin: 0 auto 40px;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }

    .profile-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
      font-size: 14px;
    }

    .form-input {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    .form-input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .form-input:disabled {
      background: #f5f5f5;
      cursor: not-allowed;
      color: #666;
    }

    .textarea {
      resize: vertical;
      min-height: 100px;
    }

    .btn-large {
      padding: 14px;
      margin-top: 20px;
      font-size: 16px;
    }

    @media (max-width: 600px) {
      .profile-card {
        padding: 20px;
      }
    }
  </style>

  <script>
    async function loadProfile() {
      try {
        const res = await fetch('/api/profile', { credentials: 'include' });
        const data = await res.json();

        if (data.success) {
          const user = data.user;
          document.getElementById('username').value = user.username;
          document.getElementById('email').value = user.email || 'email@example.com';
          document.getElementById('age').value = user.age;
          document.getElementById('city').value = user.city;
          document.getElementById('about').value = user.about || '';
          document.getElementById('interests').value = user.interests || '';
          document.getElementById('looking_for').value = user.looking_for || 'отношения';

          loadGallery(user.id);
        }
      } catch (error) {
        console.error('Error loading profile:', error);
      }
    }

    async function loadGallery(userId) {
      try {
        const res = await fetch(`/api/gallery/${userId}`, { credentials: 'include' });
        const data = await res.json();

        const preview = document.getElementById('galleryPreview');
        if (data.photos && data.photos.length > 0) {
          preview.innerHTML = data.photos.map((p, i) => `
            <div style="position: relative; border-radius: 8px; overflow: hidden;">
              <img src="${p.photo_data}" style="width: 100%; height: 100px; object-fit: cover;">
              <button onclick="deletePhoto(${p.id})" style="position: absolute; top: 2px; right: 2px; background: rgba(255,68,88,0.9); color: white; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; font-size: 14px;">×</button>
            </div>
          `).join('');
        }
      } catch (error) {
        console.error('Error loading gallery:', error);
      }
    }

    async function deletePhoto(photoId) {
      if (!confirm('Удалить фото?')) return;
      try {
        const res = await fetch(`/api/gallery/${photoId}`, {
          method: 'DELETE',
          credentials: 'include'
        });
        const data = await res.json();
        if (data.success) {
          const userId = document.getElementById('username').value;
          const profileRes = await fetch('/api/profile', { credentials: 'include' });
          const profileData = await profileRes.json();
          if (profileData.success) {
            loadGallery(profileData.user.id);
          }
        }
      } catch (error) {
        console.error('Error deleting photo:', error);
      }
    }

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const about = document.getElementById('about').value;
      const interests = document.getElementById('interests').value;
      const looking_for = document.getElementById('looking_for').value;

      try {
        const res = await fetch('/api/profile/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ about, interests, looking_for })
        });

        const data = await res.json();
        if (data.success) {
          alert('✅ Профиль обновлен!');
        }
      } catch (error) {
        console.error('Error updating profile:', error);
      }
    });

    document.getElementById('uploadGalleryBtn').addEventListener('click', async () => {
      const files = document.getElementById('galleryInput').files;
      if (files.length === 0) return alert('Выбери фото для галереи');

      const uploadBtn = document.getElementById('uploadGalleryBtn');
      uploadBtn.disabled = true;
      uploadBtn.textContent = '⏳ Загрузка...';

      let uploaded = 0;
      for (let file of files) {
        if (file.size > 5 * 1024 * 1024) {
          alert(`❌ ${file.name} слишком большое`);
          continue;
        }
        if (!file.type.startsWith('image/')) {
          alert(`❌ ${file.name} не является изображением`);
          continue;
        }

        const reader = new FileReader();
        reader.onload = async (e) => {
          try {
            const photo = e.target.result;
            const res = await fetch('/api/gallery/upload', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'include',
              body: JSON.stringify({ photo })
            });
            const data = await res.json();
            if (data.success) uploaded++;
          } catch (error) {
            console.error('Error:', error);
          }
        };
        reader.readAsDataURL(file);
      }

      setTimeout(async () => {
        uploadBtn.disabled = false;
        uploadBtn.textContent = '📸 Добавить в галерею';
        document.getElementById('galleryInput').value = '';
        alert(`✅ Загружено ${uploaded} фото`);
        const profileRes = await fetch('/api/profile', { credentials: 'include' });
        const profileData = await profileRes.json();
        if (profileData.success) {
          loadGallery(profileData.user.id);
        }
      }, 2000);
    });

    document.getElementById('uploadBtn').addEventListener('click', async () => {
      const file = document.getElementById('avatarInput').files[0];
      if (!file) return alert('Выбери фото');

      // Проверка размера (максимум 5MB)
      if (file.size > 5 * 1024 * 1024) {
        return alert('❌ Фото слишком большое (максимум 5MB)');
      }

      // Проверка типа файла
      if (!file.type.startsWith('image/')) {
        return alert('❌ Загрузи изображение (JPG, PNG и т.д.)');
      }

      const reader = new FileReader();
      reader.onerror = () => {
        alert('❌ Ошибка при чтении файла');
      };
      reader.onload = async (e) => {
        try {
          const avatar = e.target.result;
          const uploadBtn = document.getElementById('uploadBtn');
          uploadBtn.disabled = true;
          uploadBtn.textContent = '⏳ Загрузка...';

          const res = await fetch('/api/avatar/upload', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ avatar })
          });

          const data = await res.json();
          if (data.success) {
            alert('✅ Фото загружено!');
            location.reload();
          } else {
            alert('❌ Ошибка загрузки: ' + (data.message || 'Неизвестная ошибка'));
            uploadBtn.disabled = false;
            uploadBtn.textContent = '📤 Загрузить фото';
          }
        } catch (error) {
          alert('❌ Ошибка: ' + error.message);
          document.getElementById('uploadBtn').disabled = false;
          document.getElementById('uploadBtn').textContent = '📤 Загрузить фото';
        }
      };
      reader.readAsDataURL(file);
    });

    async function updateNotifBadge() {
      try {
        const res = await fetch('/api/notifications', { credentials: 'include' });
        const data = await res.json();
        if (data.success) {
          const unread = data.notifications.filter(n => !n.read).length;
          const badge = document.getElementById('notifBadge');
          if (unread > 0) {
            badge.textContent = unread;
            badge.style.display = 'flex';
          }
        }
      } catch (error) {
        console.error('Error:', error);
      }
    }

    loadProfile();
    updateNotifBadge();
    setInterval(updateNotifBadge, 5000);
  </script>
</body>
</html>
