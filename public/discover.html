<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поиск - LoveMatch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="/discover" class="logo">💕 LoveMatch</a>
      <div class="nav-links">
        <span id="username" class="username"></span>
        <a href="/matches" class="nav-item">💑 Мэтчи</a>
        <a href="/messages" class="nav-item">💬 Сообщения</a>
        <a href="/profile" class="nav-item">👤 Профиль</a>
        <a href="/admin" class="nav-item" id="adminLink" style="display:none;">⚙️ Админ</a>
        <a href="/api/logout" class="nav-item">Выход</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="discover-section">
      <div class="discover-card" id="profileCard">
        <div class="profile-loading">Загрузка профилей...</div>
      </div>

      <div class="discover-actions">
        <button id="skipBtn" class="btn-action btn-skip">👎 Пропустить</button>
        <button id="likeBtn" class="btn-action btn-like">❤️ Нравится</button>
      </div>

      <div id="matchNotif" class="match-notification" style="display:none;">
        <div class="match-content">
          <div class="match-icon">💑</div>
          <div class="match-text">
            <h3>Это мэтч!</h3>
            <p>Вы нравитесь друг другу</p>
            <a href="/messages" class="btn btn-small">Написать сообщение</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <style>
    .discover-section {
      max-width: 550px;
      margin: 40px auto;
      padding: 0 15px;
    }

    .discover-card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 50px rgba(102, 126, 234, 0.2);
      aspect-ratio: 3/4;
      display: flex;
      flex-direction: column;
      position: relative;
      border: 1px solid rgba(102, 126, 234, 0.1);
    }

    .profile-header {
      padding: 25px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      position: relative;
    }

    .profile-name {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .profile-age {
      font-size: 20px;
      opacity: 0.95;
      margin-top: 5px;
    }

    .profile-city {
      font-size: 14px;
      opacity: 0.85;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .profile-avatar {
      width: 100%;
      height: 220px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 100px;
      position: relative;
    }

    .profile-info {
      padding: 20px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .profile-about {
      margin-bottom: 15px;
    }

    .profile-about h4 {
      font-size: 12px;
      color: #999;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .profile-about p {
      font-size: 14px;
      color: #333;
      line-height: 1.5;
    }

    .profile-interests {
      margin-top: 15px;
    }

    .interest-tag {
      display: inline-block;
      background: #f0f0f0;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      margin: 4px 4px 4px 0;
      color: #666;
    }

    .compatibility {
      display: flex;
      align-items: center;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #eee;
    }

    .compatibility-icon {
      font-size: 20px;
      margin-right: 10px;
    }

    .compatibility-text {
      flex: 1;
    }

    .compatibility-text h4 {
      font-size: 12px;
      color: #999;
      margin-bottom: 3px;
    }

    .compatibility-score {
      font-size: 16px;
      font-weight: bold;
      color: #667eea;
    }

    .discover-actions {
      display: flex;
      gap: 30px;
      margin-top: 40px;
      margin-bottom: 10px;
      justify-content: center;
      align-items: center;
    }

    .btn-action {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      font-size: 36px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      font-weight: bold;
    }

    .btn-skip {
      background: white;
      border: 2px solid #e0e0e0;
      color: #666;
    }

    .btn-skip:hover {
      transform: scale(1.12);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
      background: #f9f9f9;
    }

    .btn-skip:active {
      transform: scale(0.95);
    }

    .btn-like {
      background: linear-gradient(135deg, #ff4458, #ff6b7a);
      color: white;
    }

    .btn-like:hover {
      transform: scale(1.18);
      box-shadow: 0 12px 40px rgba(255, 68, 88, 0.4);
    }

    .btn-like:active {
      transform: scale(0.95);
    }

    .profile-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #999;
    }

    .match-notification {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      border-radius: 15px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      z-index: 1000;
      animation: popIn 0.5s ease-out;
    }

    @keyframes popIn {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    .match-icon {
      font-size: 60px;
      margin-bottom: 15px;
    }

    .match-notification h3 {
      color: #667eea;
      font-size: 24px;
      margin-bottom: 10px;
    }

    .match-notification p {
      color: #666;
      margin-bottom: 20px;
    }

    .btn-small {
      padding: 10px 20px;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .discover-section {
        margin: 15px auto;
      }

      .btn-action {
        width: 60px;
        height: 60px;
        font-size: 24px;
      }
    }
  </style>

  <script>
    let currentProfiles = [];
    let currentIndex = 0;

    async function loadUsername() {
      try {
        const res = await fetch('/api/profile', { credentials: 'include' });
        const data = await res.json();
        if (data.success) {
          document.getElementById('username').textContent = `👤 ${data.user.username}`;
          if (data.user.is_admin) {
            document.getElementById('adminLink').style.display = 'block';
          }
        }
      } catch (error) {
        console.error('Error loading username:', error);
      }
    }

    async function loadProfiles() {
      try {
        const res = await fetch('/api/discover', { credentials: 'include' });
        const data = await res.json();
        if (data.success) {
          currentProfiles = data.profiles;
          currentIndex = 0;
          showProfile();
        } else {
          document.getElementById('profileCard').innerHTML = '<div class="profile-loading">Ошибка загрузки. Попробуй еще раз</div>';
        }
      } catch (error) {
        console.error('Error loading profiles:', error);
        document.getElementById('profileCard').innerHTML = '<div class="profile-loading">Ошибка подключения</div>';
      }
    }

    function showProfile() {
      const card = document.getElementById('profileCard');

      if (currentIndex >= currentProfiles.length) {
        card.innerHTML = '<div class="profile-loading">Нет больше профилей</div>';
        document.getElementById('skipBtn').disabled = true;
        document.getElementById('likeBtn').disabled = true;
        return;
      }

      const profile = currentProfiles[currentIndex];
      const emoji = profile.gender === 'Ж' ? '👩' : '👨';

      card.innerHTML = `
        <div class="profile-header">
          <div>
            <div class="profile-name">${profile.username}</div>
            <div class="profile-age">${profile.age}</div>
            <div class="profile-city">📍 ${profile.city}</div>
          </div>
          <div style="text-align: right;">
            <div style="font-size: 14px; opacity: 0.8;">Совместимость</div>
            <div style="font-size: 20px; font-weight: bold;">${profile.compatibility}%</div>
          </div>
        </div>
        <div class="profile-avatar">${emoji}</div>
        <div class="profile-info">
          ${profile.about ? `
            <div class="profile-about">
              <h4>Обо мне</h4>
              <p>${profile.about}</p>
            </div>
          ` : ''}

          ${profile.interests ? `
            <div class="profile-interests">
              <h4>Интересы</h4>
              ${profile.interests.split(',').map(i =>
                `<span class="interest-tag">${i.trim()}</span>`
              ).join('')}
            </div>
          ` : ''}

          <div class="compatibility">
            <div class="compatibility-icon">💕</div>
            <div class="compatibility-text">
              <h4>Уровень совместимости</h4>
              <div class="compatibility-score">${profile.compatibility}% совпадение</div>
            </div>
          </div>
        </div>
      `;
    }

    document.getElementById('skipBtn').addEventListener('click', () => {
      currentIndex++;
      showProfile();
    });

    document.getElementById('likeBtn').addEventListener('click', async () => {
      const profile = currentProfiles[currentIndex];
      try {
        const res = await fetch(`/api/like/${profile.id}`, {
          method: 'POST',
          credentials: 'include'
        });
        const data = await res.json();

        if (data.match) {
          document.getElementById('matchNotif').style.display = 'flex';
          setTimeout(() => {
            document.getElementById('matchNotif').style.display = 'none';
          }, 3000);
        }

        currentIndex++;
        showProfile();
      } catch (error) {
        console.error('Error liking profile:', error);
      }
    });

    loadUsername();
    loadProfiles();
  </script>
</body>
</html>
