<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация - LoveMatch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <nav class="navbar">
      <div class="container">
        <a href="/" class="logo">💕 LoveMatch</a>
      </div>
    </nav>

    <div class="auth-box" style="max-width: 500px;">
      <h2>Создать профиль</h2>

      <div id="message" class="message"></div>

      <form method="POST" action="/api/register-submit">
        <div class="form-group">
          <label for="username">Имя пользователя</label>
          <input type="text" id="username" name="username" placeholder="Уникальное имя" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="твой@email.com" required>
        </div>

        <div class="form-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" name="password" placeholder="Минимум 6 символов" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="gender">Пол</label>
            <select id="gender" name="gender" required>
              <option value="">Выбери пол</option>
              <option value="М">Мужчина</option>
              <option value="Ж">Женщина</option>
            </select>
          </div>

          <div class="form-group">
            <label for="age">Возраст</label>
            <input type="number" id="age" name="age" min="18" max="100" placeholder="25" required>
          </div>
        </div>

        <div class="form-group">
          <label for="city">Город</label>
          <input type="text" id="city" name="city" placeholder="Москва" required>
        </div>

        <button type="submit" class="btn btn-primary btn-large">Зарегистрироваться</button>
      </form>

      <div class="auth-link">
        Уже есть аккаунт? <a href="/login">Войди сюда</a>
      </div>
    </div>
  </div>

  <script>
    const errorParam = new URLSearchParams(window.location.search).get('error');
    const messageDiv = document.getElementById('message');

    if (errorParam) {
      messageDiv.classList.add('error');
      if (errorParam === '1') {
        messageDiv.textContent = '❌ Пожалуйста заполни все поля';
      } else if (errorParam === '2') {
        messageDiv.textContent = '❌ Это имя пользователя или email уже используется';
      }
    }
  </script>
</body>
</html>
