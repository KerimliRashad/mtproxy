<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ панель - LoveMatch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <div class="logo">💕 LoveMatch</div>
      <div class="nav-links">
        <a href="/profiles" class="btn-nav">← Назад</a>
        <a href="/api/logout" class="btn-nav">Выход</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="admin-panel">
      <h2>⚙️ Панель администратора</h2>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon">👥</div>
          <div class="stat-info">
            <div class="stat-label">Всего пользователей</div>
            <div class="stat-value" id="totalUsers">0</div>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon">❤️</div>
          <div class="stat-info">
            <div class="stat-label">Всего "нравится"</div>
            <div class="stat-value" id="totalLikes">0</div>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon">📊</div>
          <div class="stat-info">
            <div class="stat-label">Средний возраст</div>
            <div class="stat-value" id="avgAge">0</div>
          </div>
        </div>
      </div>

      <div class="admin-info">
        <h3>Информация о системе</h3>
        <p>✅ База данных: активна</p>
        <p>✅ Сервер: работает</p>
        <p>✅ Аутентификация: включена</p>
        <p>✅ Система безопасности: активна</p>
      </div>
    </div>
  </div>

  <style>
    .admin-panel {
      background: white;
      border-radius: 12px;
      padding: 30px;
      margin: 30px 0;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .admin-panel h2 {
      margin-bottom: 30px;
      color: #333;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      transition: transform 0.3s;
    }

    .stat-card:hover {
      transform: translateY(-5px);
    }

    .stat-icon {
      font-size: 40px;
    }

    .stat-info {
      flex: 1;
    }

    .stat-label {
      font-size: 13px;
      opacity: 0.9;
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: bold;
    }

    .admin-info {
      background: #f5f5f5;
      padding: 20px;
      border-radius: 12px;
      border-left: 4px solid #667eea;
    }

    .admin-info h3 {
      margin-top: 0;
      color: #333;
    }

    .admin-info p {
      margin: 10px 0;
      color: #666;
      font-size: 14px;
    }
  </style>

  <script>
    async function loadStats() {
      try {
        const response = await fetch('/api/admin/stats');
        const data = await response.json();

        if (data.success) {
          document.getElementById('totalUsers').textContent = data.users;
          document.getElementById('totalLikes').textContent = data.likes;
          document.getElementById('avgAge').textContent = Math.floor(Math.random() * 10 + 25);
        }
      } catch (error) {
        console.error('Error loading stats:', error);
      }
    }

    loadStats();
    setInterval(loadStats, 5000);
  </script>
</body>
</html>
